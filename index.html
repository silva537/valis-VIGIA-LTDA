<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0D1117">
  <title>Valis Vigia - Em Manutenção</title>
  <style>
    :root {
      --bg-main: #090D12;
      --bg-card: #121820;
      --bg-card-border: #1F2937;
      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
      --color-green-bright: #10B981;
      --color-yellow: #D97706;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .maintenance-card {
      background-color: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      border-radius: 16px;
      padding: 30px 20px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .icon-container {
      font-size: 48px;
      margin-bottom: 16px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }
    h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      color: var(--text-main);
    }
    p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .badge-status {
      display: inline-block;
      background: rgba(217, 119, 6, 0.15);
      color: var(--color-yellow);
      border: 1px solid rgba(217, 119, 6, 0.3);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .footer-info {
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid var(--bg-card-border);
      padding-top: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="maintenance-card">
    <div class="icon-container">🛠️</div>
    <div class="badge-status">Sistema em Atualização</div>
    <h1>VALIS VIGIA</h1>
    <p>Estamos implementando melhorias e otimizações no sistema operacional. O acesso estará disponível novamente em instantes.</p>
    
    <div class="footer-info">
      Obrigado pela compreensão.<br>Equipe de Desenvolvimento & Supervisão
    </div>
  </div>

</body>
</html>
